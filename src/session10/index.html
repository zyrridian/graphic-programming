<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Session 10 - Particle Animations</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family:
          Inter,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: #000000;
        overflow: hidden;
      }

      .banner {
        position: fixed;
        top: 16px;
        right: 16px;
        z-index: 2;
        width: min(380px, calc(100vw - 32px));
        padding: 24px;
        border-radius: 16px;
        color: #ffffff;
        background: rgba(20, 20, 20, 0.75);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      }

      .eyebrow {
        margin: 0 0 8px;
        color: #aaaaaa;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        font-size: 11px;
      }

      h1 {
        margin: 0 0 16px;
        font-size: 1.5rem;
        background: linear-gradient(90deg, #fff, #aaa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      p {
        margin: 0 0 20px;
        line-height: 1.6;
        color: #cccccc;
        font-size: 0.9rem;
      }

      .controls {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      button {
        width: 100%;
        padding: 12px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.1);
        color: #ffffff;
        border: 1px solid rgba(255, 255, 255, 0.1);
        font-family: inherit;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      button:hover {
        background: rgba(255, 255, 255, 0.2);
        transform: translateY(-2px);
      }

      button.active {
        background: #ffffff;
        color: #000000;
        box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
      }

      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <aside class="banner" aria-label="Session 10 overview">
      <p class="eyebrow">Session 10</p>
      <h1>Particle Animations</h1>
      <p>
        Modify the particle by using different textures so that it becomes an animation.
      </p>
      <div class="controls" id="controls">
        <button data-type="smoke" class="active">1. Asap (Smoke)</button>
        <button data-type="explosion">2. Ledakan (Explosion)</button>
        <button data-type="rain">3. Hujan (Rain)</button>
        <button data-type="magic">4. Efek Sihir (Magic)</button>
      </div>
    </aside>
    <div id="canvas-container"></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
